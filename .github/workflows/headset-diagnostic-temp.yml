name: TEMP Headset Diagnostic APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/headset-diagnostic-temp.yml'
  pull_request:
    branches: [master]
    paths:
      - 'HEADSET_DIAGNOSTIC_TRIGGER.md'
      - '.github/workflows/headset-diagnostic-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headset-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated diagnostic source
        uses: actions/checkout@v4
        with:
          repository: perdix1975/AndroidPdfViewer
          ref: temp/headset-diagnostic
          path: diag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build isolated APK
        working-directory: diag
        run: gradle :sample:assembleDebug --no-daemon --stacktrace

      - name: Publish temporary diagnostic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp diag/sample/build/outputs/apk/debug/sample-debug.apk Headset-Diagnostic-Z3.apk
          if gh release view headset-diagnostic-temp >/dev/null 2>&1; then
            gh release upload headset-diagnostic-temp Headset-Diagnostic-Z3.apk --clobber
            gh release edit headset-diagnostic-temp --title 'TEMP — Headset Diagnostic Z3' --notes 'Απομονωμένο diagnostic APK. Δεν περιέχει KingPool/Firebase δεδομένα.'
          else
            gh release create headset-diagnostic-temp Headset-Diagnostic-Z3.apk --title 'TEMP — Headset Diagnostic Z3' --notes 'Απομονωμένο diagnostic APK. Δεν περιέχει KingPool/Firebase δεδομένα.'
          fi

      - name: Publish build marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git marker
          cd marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B headset-diagnostic-output origin/master
          printf 'BUILD_OK\n%s\n' "${GITHUB_SHA}" > HEADSET_DIAGNOSTIC_BUILD_OK.txt
          git add HEADSET_DIAGNOSTIC_BUILD_OK.txt
          git commit -m 'TEMP: headset diagnostic build OK' || true
          git push --force origin HEAD:headset-diagnostic-output
