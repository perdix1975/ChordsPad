name: TEMP Headset Diagnostic APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/headset-diagnostic-temp.yml'
  pull_request:
    branches: [master]
    paths:
      - 'HEADSET_DIAGNOSTIC_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headset-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated diagnostic source
        uses: actions/checkout@v4
        with:
          repository: perdix1975/AndroidPdfViewer
          ref: 71f40b9cc5372e4ec04f569c91add38d71e7b46a
          path: diag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build isolated APK
        working-directory: diag
        run: gradle :sample:assembleDebug --no-daemon --stacktrace

      - name: Publish temporary diagnostic release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp diag/sample/build/outputs/apk/debug/sample-debug.apk Headset-Diagnostic-Z3.apk
          if gh release view headset-diagnostic-temp >/dev/null 2>&1; then
            gh release upload headset-diagnostic-temp Headset-Diagnostic-Z3.apk --clobber
            gh release edit headset-diagnostic-temp --title 'TEMP — Headset Diagnostic Z3' --notes 'Απομονωμένο diagnostic APK. Δεν περιέχει KingPool/Firebase δεδομένα.'
          else
            gh release create headset-diagnostic-temp Headset-Diagnostic-Z3.apk --title 'TEMP — Headset Diagnostic Z3' --notes 'Απομονωμένο diagnostic APK. Δεν περιέχει KingPool/Firebase δεδομένα.'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: headset-diagnostic-apk
          path: diag/sample/build/outputs/apk/debug/sample-debug.apk
          if-no-files-found: error
